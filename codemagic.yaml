# Codemagic CI/CD voor de iOS-build van Uitvaartbeheer.
# Codemagic draait op een macOS-cloud-machine; geen eigen Mac nodig.
#
# TWEE WORKFLOWS:
#   1. ios-unsigned    — bouwt een unsigned .ipa, gratis, geen Apple Developer
#                         account nodig. Voor sideloaden via AltStore op
#                         Windows + gratis Apple ID. App vervalt elke 7 dagen.
#   2. ios-testflight  — bouwt ondertekend en pusht naar TestFlight. Vereist
#                         €99/jaar Apple Developer + ASC API-key. App blijft
#                         permanent staan, geen verloop.
#
# Begin met workflow #1; schakel over op #2 zodra je het Developer-account
# hebt geactiveerd.

workflows:
  # ════════════════════════════════════════════════════════════════════════
  # Workflow 1: gratis unsigned build voor AltStore-sideload
  # ════════════════════════════════════════════════════════════════════════
  ios-unsigned:
    name: iOS — Unsigned IPA (voor AltStore)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: claude/funeral-director-website-raXTm
          include: true
          source: true
    scripts:
      - name: npm-deps + www-map bouwen
        script: |
          npm install
          npm run build
      - name: Capacitor — iOS-platform toevoegen + sync
        script: |
          if [ ! -d "ios/App" ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: CocoaPods
        script: |
          cd ios/App && pod install
      - name: Live Activity widget-extensie injecteren
        script: |
          # De widget-Swift + Info.plist naar het gegenereerde project kopiëren
          mkdir -p ios/App/UitvaartWidget
          cp ios-live-activity/UitvaartWidgetBundle.swift \
             ios-live-activity/UitvaartLiveActivity.swift \
             ios-live-activity/UitvaartActivityAttributes.swift \
             ios-live-activity/Info.plist \
             ios/App/UitvaartWidget/
          # Widget-target in het Xcode-project injecteren
          gem install xcodeproj --no-document
          ruby scripts/add-widget-extension.rb
      - name: Unsigned .ipa bouwen
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -derivedDataPath build \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE="" \
            build

          # Verpak .app als .ipa (zip onder Payload/ map)
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Uitvaartbeheer-unsigned.ipa Payload
          ls -lh Uitvaartbeheer-unsigned.ipa
    artifacts:
      - ios/App/Uitvaartbeheer-unsigned.ipa

  # ════════════════════════════════════════════════════════════════════════
  # Workflow 2: signed build naar TestFlight (vereist Apple Developer €99/jr)
  # ════════════════════════════════════════════════════════════════════════
  ios-testflight:
    name: iOS — TestFlight build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: nl.sok.uitvaartbeheer
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APP_ID: 6786043538
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: npm-deps + www-map bouwen
        script: |
          npm install
          npm run build
      - name: Capacitor — iOS-platform toevoegen + sync
        script: |
          if [ ! -d "ios/App" ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Info.plist aanvullen (export-compliance, camera, live activity)
        script: |
          PLIST=ios/App/App/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "$1" "$PLIST" 2>/dev/null; }
          # Export-compliance: voorkomt de 'gebruikt je app encryptie?'-vraag
          pb "Add :ITSAppUsesNonExemptEncryption bool false" || pb "Set :ITSAppUsesNonExemptEncryption false"
          # Camera + fotobibliotheek: VERPLICHT, anders crasht de app bij de scan
          pb "Add :NSCameraUsageDescription string 'Voor het scannen van de artsverklaring en documenten met de camera.'" \
            || pb "Set :NSCameraUsageDescription 'Voor het scannen van de artsverklaring en documenten met de camera.'"
          pb "Add :NSPhotoLibraryUsageDescription string 'Voor het kiezen van een bestaande foto van de artsverklaring of document.'" \
            || pb "Set :NSPhotoLibraryUsageDescription 'Voor het kiezen van een bestaande foto van de artsverklaring of document.'"
          pb "Add :NSPhotoLibraryAddUsageDescription string 'Voor het opslaan van gescande documenten.'" \
            || pb "Set :NSPhotoLibraryAddUsageDescription 'Voor het opslaan van gescande documenten.'"
          # Live Activities: app mag live-widgets tonen (voor latere lockscreen-widget)
          pb "Add :NSSupportsLiveActivities bool true" || pb "Set :NSSupportsLiveActivities true"
          # App-naam onder het icoon (robuust, want ios/ wordt elke build opnieuw gegenereerd)
          pb "Add :CFBundleDisplayName string 'Uitvaart Intake'" || pb "Set :CFBundleDisplayName 'Uitvaart Intake'"
      - name: CocoaPods
        script: |
          cd ios/App && pod install
      - name: Live Activity widget-extensie injecteren
        script: |
          # De widget-Swift + Info.plist naar het gegenereerde project kopiëren
          mkdir -p ios/App/UitvaartWidget
          cp ios-live-activity/UitvaartWidgetBundle.swift \
             ios-live-activity/UitvaartLiveActivity.swift \
             ios-live-activity/UitvaartActivityAttributes.swift \
             ios-live-activity/Info.plist \
             ios/App/UitvaartWidget/
          # Widget-target in het Xcode-project injecteren (vóór de versie-stap,
          # zodat `agvtool new-version -all` de widget hetzelfde buildnummer geeft
          # als de app — App Store eist gelijke versies).
          gem install xcodeproj --no-document
          ruby scripts/add-widget-extension.rb
      - name: App-icon genereren uit assets/icon-only.png
        script: |
          npm run cap:assets
      - name: Versie + buildnummer (uniek via tijdstempel)
        script: |
          # Marketing-versie (CFBundleShortVersionString) automatisch afgeleid van
          # APP_BUILD in js/app.js → altijd hoger dan de vorige release. Zo weigert
          # App Store Connect nooit meer met "train 1.0 is closed" / "must contain
          # a higher version". De widget erft dit via $(MARKETING_VERSION).
          APP_BUILD=$(grep -m1 -E '^const APP_BUILD' js/app.js | grep -oE '[0-9]+' | head -1)
          cd ios/App
          agvtool new-marketing-version "1.0.${APP_BUILD:-1}"
          # Buildnummer = Unix-tijdstempel: altijd uniek én hoger dan het
          # vorige, dus nooit meer "build number already used" bij uploaden.
          # -all pakt ook de widget-extensie mee (apple-generic versioning).
          agvtool new-version -all "$(date +%s)"
      - name: Widget-extensie signing (App ID + profiel ophalen/aanmaken)
        script: |
          # De widget-extensie (nl.sok.uitvaartbeheer.widget) heeft een eigen
          # App ID + provisioning-profiel nodig. --create probeert het aan te
          # maken via de App Store Connect API; lukt dat niet (bv. de API-sleutel
          # mag geen identifiers aanmaken), dan is het HANDMATIG aanmaken in
          # Apple Developer nodig — daarna downloadt deze stap het profiel.
          # Non-fataal: de build gaat door zodat we de diagnose zien.
          app-store-connect fetch-signing-files "nl.sok.uitvaartbeheer.widget" \
            --platform IOS --type IOS_APP_STORE --create \
            || echo "⚠️  Widget-profiel automatisch aanmaken/ophalen lukte niet — maak het handmatig aan in Apple Developer."
          keychain add-certificates || true
          echo "=== Geïnstalleerde provisioning-profielen ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || true
      - name: Signed .ipa bouwen
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Geen beta_groups: interne testers (App Store Connect-gebruikers)
        # krijgen elke build automatisch zodra die verwerkt is — zonder
        # beta-review. Externe groepen zouden review vereisen en botsen met
        # "another build is in review".
